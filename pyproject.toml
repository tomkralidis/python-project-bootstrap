[build-system]
requires = ["setuptools>=46.4", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foopackage"
version = "x.y.z"
description = "This is the foopackage package"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["kw1", "kw2", "kw3"]
authors = [
    {name = "Firstname Lastname", email = "you@example.org"},
]
maintainers = [
    {name = "Firstname Lastname", email = "you@example.org"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python"
]
dependencies = [
    "click"
]

[project.optional-dependencies]
dev = ["flake8"]
# doc = ["sphinx"]
test = ["pytest"]
release = ["build", "twine", "wheel"]

[project.scripts]
foopackage = "foopackage:cli"

[project.urls]
homepage = "https://github.com/tomkralidis/foopackage"
source = "https://github.com/tomkralidis/foopackage"
documentation = "https://github.com/tomkralidis/foopackage"
issues = "https://github.com/tomkralidis/foopackage/issues"
